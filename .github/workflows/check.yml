name: check
on: [push, pull_request]
jobs:
  windows-local:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo check --locked -j 2 -p rove-agent -p rove-cli
      - run: cargo test --locked -j 2 -p rove-agent --lib windows_pipe::tests
      - run: cargo test --locked -j 2 -p rove-protocol
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo build --locked -p rove-cli -p rove-agent --bins
      - run: python3 scripts/check-cli-tty.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/check-contracts.py
      - run: python scripts/check-release-assets.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rove-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: npm ci
      - run: npm test
      - run: npm run build
  native-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci --prefix apps/rove-gui
      - run: npm run build --prefix apps/rove-gui
      - run: cargo check --locked -j 2 -p rove-gui --features custom-protocol
      - run: cargo test --locked -j 2 -p rove-gui --features custom-protocol --lib
