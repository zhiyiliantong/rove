[package]
name = "rove-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
easytier = ["dep:easytier"]

[dependencies]
rove-core.workspace = true
rove-protocol.workspace = true
rove-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rusqlite.workspace = true
fs2.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
url.workspace = true
ipnet.workspace = true
aes-gcm.workspace = true
base64.workspace = true
reqwest.workspace = true
libc.workspace = true
rig = { package = "rig-core", version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
futures-util = "0.3"
sha2 = "0.10"
easytier = { git = "https://github.com/EasyTier/EasyTier", rev = "8428a89d2dabc94c97d370ec607c6ca142473626", default-features = false, features = ["zstd"], optional = true }

[dev-dependencies]
tempfile.workspace = true
rove-config-server = { path = "../../services/rove-config-server" }
quircs = "=0.10.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
